version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./hybrid_crop_model:/app/hybrid_crop_model
      - ./price_predictor:/app/price_predictor
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # Optional: Add Redis for caching
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
